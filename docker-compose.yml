# BuildBeacon — the Hub in Docker (Linux: mini PC, server, Raspberry Pi).
# File version: 1.2 (2026-11-12) — published image (GHCR) by default.
#
#   docker compose pull && docker compose up -d   published image, then
#                                                 http://<machine address>:8080
#   docker compose up -d --build                  or build it from the sources
#   docker compose logs -f                        log of the Hub
#
# Secrets and options in .env (copy of .env.example): BB_GITHUB_TOKEN,
# BB_API_TOKEN, BB_LANG=fr, BB_PORT…
services:
  hub:
    # Published for x86-64, arm64 and ARMv7; `--build` builds it from hub/ instead.
    image: ghcr.io/devcafeine/buildbeacon-hub:latest
    build: hub
    container_name: buildbeacon
    restart: unless-stopped
    # Network of the machine: DDP stream (UDP) to WLED and buildbeacon.local
    # name (mDNS) on the local network; interface on port 8080 (BB_PORT).
    network_mode: host
    env_file:
      - path: .env
        required: false
    volumes:
      # config.json, created on the first start, set up from the interface.
      - buildbeacon-data:/data
      # Local time in the log.
      - /etc/localtime:/etc/localtime:ro

volumes:
  buildbeacon-data:
