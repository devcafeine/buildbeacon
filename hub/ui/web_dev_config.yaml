# BuildBeacon UI — development server (flutter run): proxies /api/ to the Hub.
# File version: 1.1 (2026-11-12) — comments in English.
#
# mise run ui-dev: the interface with hot reload, with the Hub running
# alongside (mise run hub, port 8080). The browser only talks to the
# development server: no CORS to open on the Hub.
server:
  port: 8081
  proxy:
    - target: "http://localhost:8080/"
      prefix: "/api/"
