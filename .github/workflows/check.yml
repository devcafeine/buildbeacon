# BuildBeacon — continuous checks: format, static analysis, tests (like `mise run check`).
# File version: 1.3 (2026-11-12) — comments in English.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4

      # Same SDK as mise.toml: Flutter 3.47.6, which ships Dart 3.13.5.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      # Also generates the translations of the interface (ARB files).
      - name: Dependencies
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed sdk core plugins server tool ui

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Tests
        run: |
          for p in sdk core plugins/* server; do
            echo "== $p"
            (cd "$p" && dart test) || exit 1
          done
          echo "== ui"
          (cd ui && flutter test)

      - name: Web build
        working-directory: hub/ui
        run: flutter build web --release --no-web-resources-cdn --no-wasm-dry-run

  # Docker image: built for x86-64 and tried (first start, interface, API,
  # volume, HTTPS), then built for arm64 and ARMv7 (cross-compilation, no
  # emulation). Nothing is published.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image (x86-64)
        uses: docker/build-push-action@v6
        with:
          context: hub
          load: true
          tags: buildbeacon-hub:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: hub/tool/docker_smoke_test.sh buildbeacon-hub:ci

      - name: Images arm64 and ARMv7
        uses: docker/build-push-action@v6
        with:
          context: hub
          platforms: linux/arm64,linux/arm/v7
          outputs: type=cacheonly
          cache-from: type=gha
