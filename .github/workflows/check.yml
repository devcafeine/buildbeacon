# BuildBeacon — vérification continue : format, analyse statique, tests (comme `mise run check`).
# Version du fichier : 1.1 (2026-11-11) — Flutter (interface web) : tests et compilation web.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4

      # Même SDK que mise.toml : Flutter 3.47.6, qui embarque Dart 3.13.5.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      # Génère aussi les traductions de l'interface (fichiers ARB).
      - name: Dependencies
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed sdk core plugins server tool ui

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Tests
        run: |
          for p in sdk core plugins/* server; do
            echo "== $p"
            (cd "$p" && dart test) || exit 1
          done
          echo "== ui"
          (cd ui && flutter test)

      - name: Web build
        working-directory: hub/ui
        run: flutter build web --release --no-web-resources-cdn --no-wasm-dry-run
