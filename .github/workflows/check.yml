# BuildBeacon — vérification continue : format, analyse statique, tests (comme `mise run check`).
# Version du fichier : 1.0 (2026-11-11)
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4

      # Même SDK que mise.toml : Flutter 3.47.6 embarque Dart 3.13.5.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5

      - name: Dependencies
        run: dart pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed sdk core plugins server tool

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Tests
        run: |
          for p in sdk core plugins/* server; do
            echo "== $p"
            (cd "$p" && dart test) || exit 1
          done
