# BuildBeacon — project tools and tasks (mise).
# Version 1.11 (2026-11-12) — hub rebuilds the web interface when its sources changed.
#
# Flutter 3.47.6 ships Dart 3.13.5: the same SDK serves the Hub (hub/) and the
# Flutter Web interface (hub/ui). hub/Dockerfile and the CI use the same versions.
#
# Language of the programs: BB_LANG=en or BB_LANG=fr (default: system language).

[tools]
flutter = "3.47.6"

[tasks.get]
description = "Fetch the dependencies of the whole workspace (and generate the translations of the web interface)"
dir = "{{config_root}}/hub"
run = "flutter pub get"

[tasks.format]
description = "Format the Hub code"
dir = "{{config_root}}/hub"
run = "dart format sdk core plugins server tool ui"

[tasks.analyze]
description = "Static analysis of the Hub"
dir = "{{config_root}}/hub"
run = "dart analyze"

[tasks.test]
description = "Tests of each Hub package (SDK, core, plugins, server, web interface)"
dir = "{{config_root}}/hub"
run = 'for p in sdk core plugins/* server; do echo "== $p"; (cd "$p" && dart test) || exit 1; done; echo "== ui"; cd ui && flutter test'

[tasks.check]
description = "Check format, analysis and tests (before committing)"
dir = "{{config_root}}/hub"
run = [
  "cd ui && flutter gen-l10n",
  "dart format --output=none --set-exit-if-changed sdk core plugins server tool ui",
  "dart analyze --fatal-infos",
  'for p in sdk core plugins/* server; do echo "== $p"; (cd "$p" && dart test) || exit 1; done',
  'echo "== ui"; cd ui && flutter test',
]

[tasks.new-plugin]
description = "Create a source plugin and register it in the Hub: mise run new-plugin <name>"
dir = "{{config_root}}/hub"
run = "dart run tool/new_plugin.dart"

[tasks.hub]
description = "Run the Hub: data/config.json (created on the first start) and .env at the repository root; web interface on http://localhost:8080"
# The web interface is rebuilt first if its sources changed: never an old
# interface served by a newer Hub.
depends = ["ui-build"]
dir = "{{config_root}}/hub/server"
run = "dart run bin/hub.dart --config {{config_root}}/data/config.json --env-file {{config_root}}/.env --web {{config_root}}/hub/ui/build/web"

[tasks.ui-build]
description = "Build the web interface (hub/ui/build/web), served by the Hub; skipped when up to date"
dir = "{{config_root}}/hub"
run = "sh tool/ui_build.sh"

[tasks.ui-dev]
description = "Web interface with hot reload on http://localhost:8081, next to a running Hub (mise run hub)"
dir = "{{config_root}}/hub/ui"
run = "flutter run -d chrome"

[tasks.simulator]
description = "Fake WLED: web page http://localhost:8090 of the LEDs received over DDP (port 4048); options: mise run simulator -- --help"
dir = "{{config_root}}/hub/server"
run = "dart run bin/simulator.dart"

[tasks.test-pattern]
description = "Test pattern to WLED; to the simulator: mise run test-pattern -- --host 127.0.0.1"
dir = "{{config_root}}/hub/server"
run = "dart run bin/test_pattern.dart"

[tasks.docker-test]
description = "Build the Docker image and try it (first start, web interface, API, volume, HTTPS)"
dir = "{{config_root}}"
run = [
  "docker build -t buildbeacon-hub hub",
  "hub/tool/docker_smoke_test.sh buildbeacon-hub",
]
