# BuildBeacon Hub — espace de travail Dart : SDK, cœur, plugins, serveur, interface web.
# Version du fichier : 1.3 (2026-11-11) — interface Flutter Web (ui).
#
# Un seul `dart pub get` ici résout tous les paquets ci-dessous.
name: buildbeacon_workspace
publish_to: none

environment:
