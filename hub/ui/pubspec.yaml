# BuildBeacon — web interface (Flutter Web), served by the Hub (--web build/web).
# File version: 1.1 (2026-11-12) — comments in English.
name: buildbeacon_ui
description: BuildBeacon web interface — edit the tiles and follow them live.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  buildbeacon_core:
    path: ../core
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  intl: any
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  # Roboto bundled: otherwise Flutter Web downloads it from Google every time
  # the page opens (the Hub must work on a local network, without a CDN).
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
