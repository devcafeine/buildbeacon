# BuildBeacon — vérification continue : format, analyse statique, tests (comme `mise run check`).
# Version du fichier : 1.2 (2026-11-12) — image Docker : construite, essayée, compilée pour arm64 et ARMv7.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4

      # Même SDK que mise.toml : Flutter 3.47.6, qui embarque Dart 3.13.5.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      # Génère aussi les traductions de l'interface (fichiers ARB).
      - name: Dependencies
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed sdk core plugins server tool ui

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Tests
        run: |
          for p in sdk core plugins/* server; do
            echo "== $p"
            (cd "$p" && dart test) || exit 1
          done
          echo "== ui"
          (cd ui && flutter test)

      - name: Web build
        working-directory: hub/ui
        run: flutter build web --release --no-web-resources-cdn --no-wasm-dry-run

  # Image Docker : construite pour x86-64 et essayée (premier démarrage,
  # interface, API, volume, HTTPS), puis compilée pour arm64 et ARMv7
  # (compilation croisée, sans émulation). Rien n'est publié.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image (x86-64)
        uses: docker/build-push-action@v6
        with:
          context: hub
          load: true
          tags: buildbeacon-hub:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: hub/tool/docker_smoke_test.sh buildbeacon-hub:ci

      - name: Images arm64 and ARMv7
        uses: docker/build-push-action@v6
        with:
          context: hub
          platforms: linux/arm64,linux/arm/v7
          outputs: type=cacheonly
          cache-from: type=gha
